<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旗帜详情 - Flags of the World</title>
    <link rel="stylesheet" href="../src/style.css">
    <link rel="stylesheet" href="web/fotw.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        (function() {
            var host = location.hostname;
            if (host !== 'localhost' && host !== '127.0.0.1' && location.protocol !== 'file:') {
                document.documentElement.classList.add('remote-mode');
            }
            var saved = localStorage.getItem('svg-gallery-theme');
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var isDark = saved ? saved === 'dark' : prefersDark;
            if (isDark) {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
</head>
<body class="fotw-page">
    <header class="fotw-header">
        <div class="container">
            <div class="fotw-header-top">
                <a href="index.html" class="fotw-logo">
                    <div class="fotw-logo-flag"></div>
                    <div class="fotw-logo-text">
                        <h1>旗帜百科全书</h1>
                        <p>Flags of the World (FOTW)</p>
                    </div>
                </a>
                <a href="index.html" class="fotw-back-btn">← 返回索引</a>
            </div>
        </div>
    </header>

    <main class="fotw-main">
        <div class="fotw-breadcrumb" id="breadcrumb">
            <a href="index.html">旗帜百科</a>
            <span>›</span>
            <span id="crumbTitle">加载中...</span>
        </div>

        <div id="detailContent">
            <div class="fotw-loading">
                <div class="fotw-loading-spinner"></div>
                <p>正在加载旗帜详情...</p>
            </div>
        </div>
    </main>

    <script src="web/fotw-detail.js"></script>
</body>
</html>

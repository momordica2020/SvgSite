<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Svg Site</title>
    <link rel="stylesheet" href="src/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        (function() {
            const saved = localStorage.getItem('svg-gallery-theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = saved ? saved === 'dark' : prefersDark;
            if (isDark) {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <h1>Svg Site</h1>
            </div>
            <div class="search-container">
                <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="M21 21l-4.35-4.35"/>
                </svg>
                <input type="text" id="searchInput" placeholder="搜索图片名称...">
            </div>
            <button class="theme-toggle-btn" id="themeToggleBtn" title="切换主题">
                <svg id="themeIconSun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                    <circle cx="12" cy="12" r="5"/>
                    <line x1="12" y1="1" x2="12" y2="3"/>
                    <line x1="12" y1="21" x2="12" y2="23"/>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                    <line x1="1" y1="12" x2="3" y2="12"/>
                    <line x1="21" y1="12" x2="23" y2="12"/>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>
                <svg id="themeIconMoon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
        </div>
    </header>

    <main class="main">
        <button class="sidebar-toggle" id="sidebarToggle" title="分类筛选">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
            <span>分类</span>
        </button>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <div class="layout">
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <h2>分类标签</h2>
                </div>
                <div class="sidebar-search">
                    <input type="text" id="tagSearchInput" placeholder="筛选标签...">
                </div>
                <nav class="tags-nav" id="tagsList"></nav>
            </aside>
            <div class="gallery-area">
                <div class="gallery-toolbar">
                    <span class="result-count" id="resultCount"></span>
                </div>
                <div id="gallery" class="gallery"></div>
                <div id="emptyState" class="empty-state" style="display: none;">
                    <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                    </svg>
                    <p>没有找到匹配的图片</p>
                </div>
                <div class="pagination" id="pagination"></div>
            </div>
        </div>
    </main>

    <!-- 全屏预览模态框 -->
    <div id="previewModal" class="modal">
        <div class="modal-overlay" onclick="closeModal()"></div>
        <div class="modal-fullscreen">
            <div class="modal-toolbar">
                <div class="modal-toolbar-info">
                    <button class="close-btn" onclick="closeModal()" title="返回">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="19" y1="12" x2="5" y2="12"/>
                            <polyline points="12 19 5 12 12 5"/>
                        </svg>
                        <span>返回</span>
                    </button>
                    <h2 id="previewTitle">图片预览</h2>
                    <div class="preview-tags" id="previewTags"></div>
                </div>
                <div class="modal-toolbar-actions">
                    <button class="detail-link-btn" id="viewDetailBtn" title="在新页面查看详情">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                            <polyline points="15 3 21 3 21 9"/>
                            <line x1="10" y1="14" x2="21" y2="3"/>
                        </svg>
                        查看详情
                    </button>
                    <button class="download-btn" id="downloadSvgBtn">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        下载 SVG
                    </button>
                    <div class="png-download-group">
                        <span class="png-label">PNG:</span>
                        <button class="download-btn-small" data-size="256">256px</button>
                        <button class="download-btn-small" data-size="512">512px</button>
                        <button class="download-btn-small" data-size="1024">1024px</button>
                        <button class="download-btn-small" data-size="2048">2048px</button>
                        <button class="download-btn-small" data-size="4096">4096px</button>
                    </div>
                </div>
            </div>

            <div class="preview-canvas-wrapper" id="previewCanvasWrapper">
                <div class="preview-canvas" id="previewCanvas">
                    <img id="previewSvgImg" src="" alt="" draggable="false">
                </div>
            </div>

            <div class="zoom-indicator" id="zoomIndicator">100%</div>
        </div>
    </div>

    <script src="src/main.js"></script>
</body>
</html>

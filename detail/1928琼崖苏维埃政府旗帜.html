    <script>
        const currentImage = {"id":"1928琼崖苏维埃政府旗帜","name":"琼崖苏维埃政府旗帜（1928）","tags":["中国","中国共产党","苏维埃","琼崖","海南","红色","黄色","镰锤","五角星","汉字"],"svgFile":"1928琼崖苏维埃政府旗帜.svg","viewBox":"0 0 793.701 566.929","svgWidth":"793.701","svgHeight":"566.929","originalImage":"苏维埃琼崖政府相关旗帜1.jpg","description":"1928年8月12日，陈玉候出席在乐会四区髙朗村召开的琼崖第一次工农兵代表大会。大会成立第一届琼崖苏维埃政府，王文明为主席，陈玉候、梁秉枢等为委员，陈玉候具体负责财政工作。他亲自起草的《临时土地法令》和《工商税收条例》颁布实施后，得到人民群众的热烈拥护。11月，中共广东省委扩大会议确定“以城市为工作中心”的错误方针，省委认为琼崖红军反“围剿”斗争受挫的原因是城市工运、兵运没有搞好，要求琼崖特委机关迁往海口。陈玉候协同王文明、梁秉枢等率领琼崖苏维埃政府机关和红军余部,排除各种困难和干扰，进入定安县南部的母瑞山，开辟山区革命根据地。\n\n1930年8月，琼崖第二次工农兵代表大会在母瑞山召开，选举产生第二届琼崖苏维埃，陈玉候再次当选为委员。\n\n1932年8月，国民党反动军阀陈汉光抵达琼崖，围剿母瑞山根据地。9月13日，陈玉候的儿子，儿童团团长陈少坚在掩护群众转移时中弹牺牲。同一天，陈玉候在母瑞山西侧的南典山坡尾村抗击敌人的战斗中，因子弹打光与敌进行肉搏时倒在血泊中。他的头颅被敌人割去领赏，时年43岁。中华人民共和国成立后，陈玉候、陈少坚被人民政府追认为革命烈士。"};
